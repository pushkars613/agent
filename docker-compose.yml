version: "3.9"

# Phase 5 infra. Not required to run the current SQLite-backed foundation —
# start these when you implement PostgresQdrantStore.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - jarvis_pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - jarvis_qdrant_data:/qdrant/storage

volumes:
  jarvis_pg_data:
  jarvis_qdrant_data:
